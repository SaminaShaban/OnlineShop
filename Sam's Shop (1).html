<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Sam's Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,500..900&family=Hanken+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Caveat:wght@600&family=Noto+Naskh+Arabic:wght@500;700&family=Pacifico&family=Fredoka:wght@500;600&display=swap">
<style>
/* Layout: a sequence of full-screen "pages" on a bright, colourful ground (no black sections).
   Palette switch in the header: Both (blue + pink), Boys (blue), Girls (pink). Same layout as before:
   pinned scroll-story hero, studio with sticky shirt, sideways gallery, process, gradient contact page. */
:root {
  color-scheme: light;
  --bg: #F5F3FA;
  --surface: #FFFFFF;
  --surface-2: #ECE9F6;
  --fg: #151836;
  --muted: #5C6080;
  --line: #D5D2E6;
  --accent: #3F4FE6;
  --accent-2: #F2509A;
  --accent-ink: #3340D0;
  --on-accent: #FFFFFF;
  --focus: #3F4FE6;
  --bad: #C0262D;
  --blob-a: rgba(80, 140, 255, 0.34);
  --blob-b: rgba(255, 110, 170, 0.30);
  --halo-b: #E4E0F5;
  --band-bg: linear-gradient(120deg, #3B4FE0 0%, #7B4BDC 52%, #E8478F 100%);
  --band-bg-2: linear-gradient(120deg, #E8478F 0%, #7B4BDC 48%, #3B4FE0 100%);
  --band-fg: #FFFFFF;
  --band-ink: #2A2F9E;
  --band-line: rgba(255, 255, 255, 0.34);
  --logo-a: #F2509A;
  --logo-b: #FF9CC2;
  --logo-ink: #8A1F55;
  --logo-tint: #FFE9F2;
  --logo-bow: #FFD1E4;
  --display: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
  --body: 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --ku: 'Noto Naskh Arabic', 'Vazirmatn', 'Segoe UI', Tahoma, serif;
  --head: 57px;
  --pinH: calc(100svh - var(--head) - env(safe-area-inset-top, 0px));
}
:root[data-palette="boys"] {
  --bg: #EDF4FF; --surface: #FFFFFF; --surface-2: #DCE8FB; --fg: #0F1E3F; --muted: #4F6180; --line: #C3D4F0;
  --accent: #1F63F0; --accent-2: #19B5E8; --accent-ink: #1650D6; --focus: #1F63F0;
  --blob-a: rgba(40, 120, 255, 0.36); --blob-b: rgba(25, 190, 230, 0.28); --halo-b: #D5E5FB;
  --band-bg: linear-gradient(120deg, #0F46C8 0%, #1F7BF0 58%, #18B6D8 100%);
  --band-bg-2: linear-gradient(120deg, #18B6D8 0%, #1F63F0 45%, #0B2E86 100%);
  --band-ink: #0B2E86;
  --logo-a: #1F63F0; --logo-b: #7DB4FF; --logo-ink: #0B2E86; --logo-tint: #E6F0FF; --logo-bow: #CFE3FF;
}
:root[data-palette="girls"] {
  --bg: #FFF0F6; --surface: #FFFFFF; --surface-2: #FADDE9; --fg: #3A1030; --muted: #7C4B6A; --line: #F0C6D8;
  --accent: #E22E7B; --accent-2: #B45CF0; --accent-ink: #C21F68; --focus: #E22E7B;
  --blob-a: rgba(255, 100, 160, 0.36); --blob-b: rgba(190, 110, 255, 0.28); --halo-b: #F8D9E8;
  --band-bg: linear-gradient(120deg, #B81B62 0%, #E8468C 55%, #F36A98 100%);
  --band-bg-2: linear-gradient(120deg, #F36A98 0%, #E22E7B 45%, #8F1550 100%);
  --band-ink: #8F1550;
  --logo-a: #EC3C8A; --logo-b: #FF9CC2; --logo-ink: #8F1550; --logo-tint: #FFE3EE; --logo-bow: #FFD1E4;
}

* { box-sizing: border-box; }
html { scroll-snap-type: y proximity; scroll-padding-top: calc(env(safe-area-inset-top, 0px) + var(--head)); }
body { background: var(--bg); color: var(--fg); font: 16px/1.55 var(--body); -webkit-font-smoothing: antialiased; transition: background 0.4s; }
body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; background: radial-gradient(60vmax 50vmax at 0% 0%, var(--blob-a), transparent 62%), radial-gradient(60vmax 50vmax at 100% 100%, var(--blob-b), transparent 62%); }
h1, h2, h3, p { margin: 0; }
h1, h2 { font-family: var(--display); font-stretch: 108%; font-weight: 800; text-transform: uppercase; letter-spacing: -0.01em; line-height: 0.95; text-wrap: balance; }
h2 { font-size: clamp(2rem, 5vw, 3.6rem); }
h3 { font-family: var(--display); font-weight: 700; letter-spacing: -0.01em; line-height: 1.15; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
section[id] { scroll-margin-top: calc(env(safe-area-inset-top, 0px) + var(--head)); }
.wrap { width: min(1200px, 100%); margin-inline: auto; padding-inline: clamp(16px, 4vw, 40px); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.snap { scroll-snap-align: start; }
.ku { font-family: var(--ku); }
.eyebrow { font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 10px; }
.eyebrow::before { content: ""; width: 22px; height: 2px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); flex: none; }
.page { min-height: var(--pinH); display: grid; align-content: center; padding-block: clamp(48px, 8vw, 96px); }

@supports (animation-timeline: view()) {
  .reveal { animation: rise linear both; animation-timeline: view(); animation-range: entry 0% entry 60%; }
  @keyframes rise { from { opacity: 0.25; transform: translateY(40px); } to { opacity: 1; transform: none; } }
}

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0.95rem 1.5rem; border-radius: 3px; border: 1px solid var(--fg); background: transparent; color: var(--fg); font-family: var(--body); font-weight: 600; font-size: 0.78rem; letter-spacing: 0.12em; text-transform: uppercase; line-height: 1; text-decoration: none; transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease; }
.btn:hover { background: var(--fg); color: var(--bg); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: var(--fg); border-color: var(--fg); color: var(--bg); }
.btn.small { padding: 0.7rem 1rem; font-size: 0.72rem; }

/* header */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); transition: background 0.4s; }
.bar-in { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: calc(var(--head) - 1px); }
.brand { display: inline-flex; align-items: center; gap: 8px; font-family: 'Pacifico', 'Brush Script MT', cursive; font-weight: 400; font-size: 1.4rem; line-height: 1; letter-spacing: 0; background: none; border: 0; padding: 0; color: var(--logo-ink); white-space: nowrap; }
.brand .mark { width: 32px; height: 30px; }
.nav { display: flex; align-items: center; gap: 4px; }
.link { background: none; border: 0; padding: 0.5rem 0.9rem; font-size: 0.74rem; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 600; color: var(--muted); }
.link:hover { color: var(--fg); }
.palette { display: flex; align-items: center; gap: 8px; margin-right: 8px; }
.palette .lab { font-size: 0.64rem; }
.pal { width: 22px; height: 22px; padding: 0; border: 0; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.22); }
.pal[aria-checked="true"] { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--fg); }
@media (max-width: 759px) { .link, .palette .lab { display: none; } .palette { margin-right: 0; } }

/* page dots */
.dotnav { position: fixed; right: 12px; top: 50%; transform: translateY(-50%); z-index: 15; display: grid; gap: 2px; mix-blend-mode: difference; color: #fff; }
.dotnav button { position: relative; width: 24px; height: 24px; background: none; border: 0; padding: 0; }
.dotnav button::before { content: ""; position: absolute; inset: 7px; border: 1.5px solid currentColor; border-radius: 50%; transition: background 0.2s; }
.dotnav button[aria-current="true"]::before { background: currentColor; }
.dotnav span { position: absolute; right: 28px; top: 50%; transform: translateY(-50%); font-family: var(--mono); font-size: 0.66rem; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0; pointer-events: none; white-space: nowrap; transition: opacity 0.2s; }
.dotnav button:hover span, .dotnav button:focus-visible span { opacity: 1; }
@media (max-width: 1099px) { .dotnav { display: none; } }

/* hero: the shop's logo. A calm first page with no colours; scrolling moves straight on */
.hero { min-height: var(--pinH); display: grid; align-items: center; padding-block: clamp(12px, 2.5vh, 36px); }
.hero-center { display: grid; justify-items: center; gap: clamp(8px, 1.6vh, 16px); text-align: center; }
.logo-big { width: min(92vw, 460px, calc((var(--pinH) - 200px) * 1.18)); height: auto; filter: drop-shadow(0 18px 22px rgba(190, 40, 110, 0.22)); animation: bob 7s ease-in-out infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
.sp { transform-box: fill-box; transform-origin: center; animation: twinkle 3.2s ease-in-out infinite; }
.sp2 { animation-delay: 0.8s; } .sp3 { animation-delay: 1.6s; } .sp4 { animation-delay: 2.3s; }
@keyframes twinkle { 0%, 100% { transform: scale(1) rotate(0); opacity: 1; } 50% { transform: scale(0.65) rotate(18deg); opacity: 0.7; } }
.tagline { font-family: 'Fredoka', var(--body); font-stretch: normal; font-weight: 600; text-transform: none; letter-spacing: 0; line-height: 1.1; font-size: clamp(1.4rem, 3.2vw, 2.1rem); color: var(--logo-ink); }
.sub-tag { color: var(--muted); max-width: 46ch; }
.cta-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.cue { display: inline-flex; align-items: center; gap: 8px; background: none; border: 0; padding: 4px 8px; font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
.cue svg { width: 14px; height: 14px; animation: nudge 1.8s ease-in-out infinite; }
@keyframes nudge { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(4px); } }
@media (max-height: 640px) { .sub-tag { display: none; } }

/* studio */
.studio-grid { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: clamp(24px, 5vw, 64px); align-items: start; }
.section-head { display: grid; gap: 16px; margin-bottom: clamp(28px, 4vw, 48px); max-width: 60ch; }
.section-head p:not(.eyebrow) { color: var(--muted); }
.stage { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--head) + 16px); }
.stage-card { background: radial-gradient(closest-side, #fff, var(--halo-b)); border: 1px solid var(--line); padding: clamp(12px, 3vw, 28px); display: grid; gap: 10px; }
.stage .shirt { display: block; width: 100%; max-width: 540px; height: auto; margin-inline: auto; filter: drop-shadow(0 20px 18px rgba(40, 30, 90, 0.28)); }
.stage-cap { display: flex; justify-content: space-between; gap: 12px; font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
@media (max-width: 899px) {
  .studio-grid { display: block; }
  .stage { top: calc(env(safe-area-inset-top, 0px) + var(--head)); z-index: 5; margin-bottom: 8px; margin-inline: calc(clamp(16px, 4vw, 40px) * -1); }
  .stage-card { padding: 8px 16px; border-inline: 0; }
  .stage .shirt { max-height: 30vh; }
}
.controls { min-width: 0; }
.step { border-top: 1px solid var(--line); padding-block: 24px; display: grid; gap: 16px; }
.step.first { border-top: 0; padding-top: 0; }
.step-title { display: flex; align-items: baseline; gap: 12px; }
.step-title h3 { font-size: 1.15rem; text-transform: uppercase; letter-spacing: 0.02em; }
.step-n { font-family: var(--mono); font-size: 0.72rem; color: var(--accent-ink); letter-spacing: 0.12em; }
.step-val { margin-left: auto; font-family: var(--mono); font-size: 0.74rem; letter-spacing: 0.06em; color: var(--muted); text-align: right; text-transform: uppercase; }
.swatches, .inks { display: flex; flex-wrap: wrap; gap: 14px; padding: 4px; }
.swatch, .ink { width: 38px; height: 38px; padding: 0; border-radius: 50%; border: 0; box-shadow: inset 0 0 0 1px rgba(60, 60, 90, 0.35); }
.ink { width: 30px; height: 30px; }
.swatch[aria-checked="true"], .ink[aria-checked="true"] { box-shadow: 0 0 0 3px var(--bg), 0 0 0 4.5px var(--fg), inset 0 0 0 1px rgba(60, 60, 90, 0.35); }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); background: var(--surface); max-width: 100%; }
.seg button { border: 0; background: transparent; padding: 0.7rem 1.1rem; font-size: 0.76rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--fg); color: #fff; }
.seg.wide { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.tile { display: grid; gap: 2px; justify-items: start; padding: 8px 8px 10px; background: var(--surface); border: 1px solid var(--line); text-align: left; transition: border-color 0.15s, transform 0.15s; }
.tile:hover { border-color: var(--fg); transform: translateY(-2px); }
.tile[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.tile svg { width: 100%; height: auto; aspect-ratio: 1; color: var(--fg); margin-bottom: 6px; }
.tile span { font-weight: 600; font-size: 0.82rem; line-height: 1.2; }
.tile small { font-family: var(--mono); font-size: 0.6rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.hint { padding: 22px 16px; border: 1px dashed var(--muted); background: var(--surface); color: var(--muted); font-size: 0.95rem; }
.drop { display: grid; gap: 4px; justify-items: center; text-align: center; padding: 30px 16px; border: 1px dashed var(--muted); background: var(--surface); cursor: pointer; overflow-wrap: anywhere; }
.drop:hover, .drop:focus-within { border-color: var(--accent); }
.drop strong { font-family: var(--display); font-size: 1.05rem; text-transform: uppercase; letter-spacing: 0.02em; }
.drop span { color: var(--muted); font-size: 0.9rem; }
.err { color: var(--bad); font-size: 0.92rem; }
.note { color: var(--muted); font-size: 0.92rem; max-width: 56ch; }
.sliders { display: grid; gap: 12px; }
.slider { display: grid; grid-template-columns: 96px minmax(0, 1fr); align-items: center; gap: 12px; font-size: 0.9rem; }
.slider input { width: 100%; accent-color: var(--accent); }
.check { display: flex; align-items: center; gap: 10px; font-size: 0.95rem; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }
.field { display: grid; gap: 8px; }
.lab { font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.field input[type="text"] { width: 100%; padding: 0.7rem 0; border: 0; border-bottom: 1px solid var(--fg); border-radius: 0; background: transparent; color: var(--fg); font: inherit; font-size: 1.1rem; }
.field input[type="text"]::placeholder { color: var(--muted); }
.field input[type="text"]:focus-visible { outline: 0; border-bottom: 2px solid var(--accent); }
.presets { display: flex; flex-wrap: wrap; gap: 8px; }
.pchip { border: 1px solid var(--line); background: var(--surface); padding: 0.4rem 0.8rem; font-size: 0.95rem; line-height: 1.3; }
.pchip:hover { border-color: var(--accent); }
.row { display: flex; flex-wrap: wrap; gap: 20px 32px; align-items: end; }
.qty { display: inline-flex; align-items: center; border: 1px solid var(--line); background: var(--surface); }
.qty button { width: 42px; height: 42px; border: 0; background: transparent; font-size: 1.2rem; line-height: 1; }
.qty button:hover { background: var(--surface-2); }
.qty output { min-width: 3ch; text-align: center; font-family: var(--mono); font-weight: 500; font-variant-numeric: tabular-nums; }
.summary { width: 100%; font: 0.82rem/1.6 var(--mono); padding: 14px; border: 1px solid var(--line); border-radius: 0; background: var(--surface); color: var(--fg); resize: vertical; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }

/* wall: a swipeable strip, not pinned */
.page { grid-template-columns: minmax(0, 1fr); }
.wall-page { background: var(--band-bg); color: var(--band-fg); }
.wall-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px 28px; margin-bottom: clamp(20px, 3vw, 36px); }
.wall-head .eyebrow { color: var(--band-fg); opacity: 0.85; margin-bottom: 14px; }
.wall-head .eyebrow::before { background: #fff; }
.wall-head p.sub { opacity: 0.92; max-width: 40ch; flex: 1 1 220px; }
.arrows { display: flex; gap: 8px; }
.arrows button { width: 46px; height: 46px; border: 1px solid var(--band-line); background: rgba(255, 255, 255, 0.14); color: #fff; font-size: 1.2rem; line-height: 1; border-radius: 50%; transition: background 0.2s, color 0.2s; }
.arrows button:hover { background: #fff; color: var(--band-ink); }
.rail { min-width: 0; display: flex; gap: 16px; overflow-x: auto; scroll-snap-type: x proximity; padding: 8px clamp(16px, 4vw, 40px) 22px; scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, 0.75) transparent; }
.wcard { flex: none; width: clamp(210px, 22vw, 290px); scroll-snap-align: start; display: grid; gap: 8px; padding: 14px; background: var(--surface); border: 0; color: var(--fg); text-align: left; transition: transform 0.2s ease; box-shadow: 0 14px 30px rgba(20, 10, 80, 0.25); }
.wcard:hover { transform: translateY(-4px); }
.wcard .shirt { width: 100%; height: auto; filter: drop-shadow(0 12px 10px rgba(40, 30, 90, 0.25)); }
.wcard b { font-family: var(--display); font-size: 1.05rem; text-transform: uppercase; letter-spacing: 0.02em; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.wcard b .ku { font-size: 1.05rem; text-transform: none; letter-spacing: 0; color: var(--accent-ink); }
.wcard small { display: flex; justify-content: space-between; gap: 8px; font-family: var(--mono); font-size: 0.64rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }

/* process */
.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 32px 28px; }
@media (max-width: 899px) { .steps { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 559px) { .steps { grid-template-columns: minmax(0, 1fr); } }
.steps li { border-top: 1px solid var(--fg); padding-top: 16px; display: grid; gap: 10px; align-content: start; }
.steps .n { font-family: var(--display); font-stretch: 110%; font-weight: 800; font-size: clamp(2.6rem, 5vw, 4rem); line-height: 1; letter-spacing: -0.02em; background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; width: fit-content; }
.steps h3 { font-size: 1.15rem; text-transform: uppercase; letter-spacing: 0.02em; }
.steps p { color: var(--muted); }

/* contact */
.band { background: var(--band-bg-2); color: var(--band-fg); }
.band .eyebrow { color: var(--band-fg); opacity: 0.85; }
.band .eyebrow::before { background: #fff; }
.band .section-head p:not(.eyebrow) { color: var(--band-fg); opacity: 0.9; }
.contact-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 719px) { .contact-grid { grid-template-columns: minmax(0, 1fr); } }
.contact-card { background: rgba(255, 255, 255, 0.16); border: 1px solid var(--band-line); padding: clamp(20px, 3vw, 32px); display: grid; gap: 18px; min-width: 0; backdrop-filter: blur(6px); }
.contact-card .lab { color: var(--band-fg); opacity: 0.85; }
.big { font-family: var(--display); font-stretch: 108%; font-weight: 800; font-size: clamp(1.4rem, 3.8vw, 2.3rem); letter-spacing: -0.01em; line-height: 1.1; overflow-wrap: anywhere; user-select: all; }
.band .btn { border-color: #fff; color: #fff; }
.band .btn:hover { background: #fff; color: var(--band-ink); }
.band .btn.primary { background: #fff; color: var(--band-ink); }
.band .btn.primary:hover { background: transparent; color: #fff; }
.foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px; margin-top: clamp(40px, 8vw, 96px); padding-top: 20px; border-top: 1px solid var(--band-line); font-size: 0.85rem; opacity: 0.9; }

/* small screens: keep text from colliding */
.step-title { flex-wrap: wrap; }
.seg button { flex: 1 1 auto; }
@media (max-width: 519px) {
  .brand { font-size: 1.2rem; gap: 6px; }
  .brand .mark { width: 26px; height: 24px; }
  .palette { gap: 6px; }

function layoutText(text) {
  const words = (text || '').trim().split(/\s+/).filter(Boolean);
  const lines = [];
  let cur = '';
  for (const w of words) {
    if (!cur) cur = w;
    else if ((cur + ' ' + w).length <= 11) cur += ' ' + w;
    else { lines.push(cur); cur = w; }
  }
  if (cur) lines.push(cur);
  return lines.slice(0, 4);
}
const REDUCED = (() => { try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } })();
function go(id) {
  if (id === 'hero') { window.scrollTo({ top: 0, behavior: REDUCED ? 'auto' : 'smooth' }); return; }
  const el = document.getElementById(id);
  if (el) el.scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', block: 'start' });
}

/* ---- the shirt: clean silhouette, then the print, then two baked lighting maps
   (shadows multiply, highlights screen) that carry the fabric folds, seams, ribbed collar and weave ---- */
const BODY = 'M148 32 C132 38 102 46 80 56 C64 70 40 108 22 156 L90 194 L100 172 C98 260 94 340 92 416 Q92 424 104 424 L296 424 Q308 424 308 416 C306 340 302 260 300 172 L310 194 L378 156 C360 108 336 70 320 56 C298 46 268 38 252 32 C244 66 156 66 148 32 Z';
const BACKNECK = 'M148 32 C160 22 240 22 252 32 C244 66 156 66 148 32 Z';
const NECK = 'M252 32 C244 66 156 66 148 32';
function Shirt({ color, uid, className, label, children }) {
  const L = lum(color);
  const shOp = L < 0.2 ? 0.85 : 1;
  const hiOp = L < 0.2 ? 0.9 : L < 0.5 ? 0.6 : 0.3;
  const fillStyle = { fill: color, transition: 'fill .4s' };
  return html`<svg className=${'shirt ' + (className || '')} viewBox="0 0 400 440" role="img" aria-label=${label || 'T-shirt preview'}>
    <defs><clipPath id=${'cl' + uid}><path d=${BODY} /></clipPath></defs>
    <path d=${BACKNECK} style=${fillStyle} />
    <path d=${BACKNECK} fill="#000" fillOpacity="0.5" />
    <path d="M148 32 C160 22 240 22 252 32" fill="none" stroke="#000" strokeOpacity="0.28" strokeWidth="4" />
    <rect x="188" y="25" width="24" height="12" rx="1" fill="#ECECE7" />
    <text x="200" y="33.2" textAnchor="middle" fontSize="4.2" letterSpacing="0.5" fontFamily="'IBM Plex Mono', monospace" fill="#444">SAM'S</text>
    <path d=${BODY} style=${fillStyle} />
    <g clipPath=${'url(#cl' + uid + ')'}>${children}</g>
    <image href=${MAP_SH} x="0" y="0" width="400" height="440" preserveAspectRatio="none" opacity=${shOp} style=${{ mixBlendMode: 'multiply' }} />
    <image href=${MAP_HI} x="0" y="0" width="400" height="440" preserveAspectRatio="none" opacity=${hiOp} style=${{ mixBlendMode: 'screen' }} />
    <path d=${NECK} fill="none" stroke="#000" strokeOpacity="0.35" strokeWidth="1" />
  </svg>`;
}

/* ---- what is printed on the chest (print area is 140 x 188 in shirt units) ---- */
const AX = 125, AY = 104, AW = 150, AH = 214;
function Print({ cfg, shirtHex }) {
  const ink = resolveInk(cfg.inkId, shirtHex);
  const ghost = (label) => html`<g>
    <rect x=${AX} y=${AY} width=${AW} height=${AH} fill="none" stroke=${ink} strokeOpacity="0.55" strokeDasharray="6 6" strokeWidth="1.5" />
    <text x=${AX + AW / 2} y=${AY + AH / 2} textAnchor="middle" dominantBaseline="central" fill=${ink} fillOpacity="0.65" fontFamily="'IBM Plex Mono', monospace" fontSize="11" letterSpacing="1.5">${label}</text>
  </g>`;
  if (cfg.mode === 'upload') {
    if (!cfg.upload) return ghost('YOUR ARTWORK');
    const w = (AW * cfg.scale) / 100, h = (AH * cfg.scale) / 100;
    const cx = AX + AW / 2 + cfg.offX, cy = AY + AH / 2 + cfg.offY;
    return html`<image href=${cfg.upload.url} x=${cx - w / 2} y=${cy - h / 2} width=${w} height=${h} preserveAspectRatio="xMidYMid meet" style=${{ mixBlendMode: cfg.blend ? 'multiply' : 'normal' }} />`;
  }
  const d = DESIGNS.find((x) => x.id === cfg.design);
  const lines = layoutText(cfg.text);
  const hasText = lines.length > 0;
  if (!d && !hasText) return ghost('ADD A DESIGN');
  const parts = [];
  const artSize = hasText ? 124 : 150;
  if (d) {
    const y = hasText ? AY : AY + (AH - artSize) / 2;
    parts.push(html`<svg key="art" x=${AX + (AW - artSize) / 2} y=${y} width=${artSize} height=${artSize} viewBox="0 0 100 100" overflow="visible">${d.draw(ink)}</svg>`);
  }
  if (hasText) {
    const ts = TEXT_STYLES[cfg.textStyle || 'bold'];
    const longest = Math.max(...lines.map((l) => l.length));
    const size = Math.min(d ? 26 : 38, AW / (longest * ts.f));
    const lh = size * (ts.upper || cfg.textStyle === 'hand' ? 1.12 : 1.35);
    const cy = d ? AY + artSize + (AH - artSize) / 2 : AY + AH / 2;
    const total = lh * lines.length;
    parts.push(html`<g key="txt" fill=${ink} fontFamily=${ts.family} fontWeight=${ts.weight} textAnchor="middle" letterSpacing=${ts.upper ? '0.04em' : '0'}>
      ${lines.map((l, k) => html`<text key=${k} x=${AX + AW / 2} y=${cy - total / 2 + lh * (k + 0.5)} fontSize=${size} dominantBaseline="central">${ts.upper ? l.toUpperCase() : l}</text>`)}
    </g>`);
  }
  return html`<g className="print-in">${parts}</g>`;
}

      <p className="sub-tag">Pick a colour, pick a design or send us your own, and see it on the shirt first.</p>
      <div className="cta-row">
        <button className="btn primary" type="button" onClick=${() => go('studio')}>Start designing</button>
        <button className="btn" type="button" onClick=${() => go('contact')}>Call or email</button>
      </div>
      <button type="button" className="cue" onClick=${() => go('studio')} aria-label="Scroll to the studio"><span>Scroll</span><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M3 6l5 5 5-5" /></svg></button>
    </div>
  </section>`;
}

function Studio({ st }) {
  const { color, setColor, mode, setMode, design, setDesign, text, setText, textStyle, setTextStyle, inkId, setInkId,
    size, setSize, qty, setQty, up, setUp } = st;
  const [err, setErr] = useState('');
  const [note, setNote] = useState('');
  const [tab, setTab] = useState('kurdish');
  const taRef = useRef(null);
  const [hov, setHov] = useState(null);
  const shown = hov !== null ? hov : color;
  const c = COLORS[shown];
  const sc = COLORS[color];
  const d = DESIGNS.find((x) => x.id === design);
  const cfg = { mode, design, text, textStyle, inkId, upload: up.file, scale: up.scale, offX: up.offX, offY: up.offY, blend: up.blend };

  useEffect(() => {
    if (design === 'none') setTab('words');
    else { const g = DESIGNS.find((x) => x.id === design); if (g) setTab(g.group); }
  }, [design]);

  function onText(v) {
    setText(v);
    if (isArabic(v) && textStyle !== 'ku') setTextStyle('ku');
    else if (!isArabic(v) && v && textStyle === 'ku') setTextStyle('bold');
  }
  function pickPreset(v) { setText(v); setTextStyle(isArabic(v) ? 'ku' : 'bold'); }
  function onFile(file) {
    if (!file) return;
    if (!file.type || file.type.indexOf('image/') !== 0) { setErr('Please choose an image file (PNG, JPG, SVG or WebP).'); return; }
    if (file.size > 8 * 1024 * 1024) { setErr('That file is over 8 MB. Email it to us instead and we will prepare the prototype.'); return; }
    const fr = new FileReader();
    fr.onload = () => { setErr(''); setUp({ ...up, file: { url: fr.result, name: file.name } }); };
    fr.onerror = () => setErr('We could not read that file. Try another one.');
    fr.readAsDataURL(file);
  }

  const inkName = inkId === 'auto' ? 'Auto (picked to suit the shirt)' : INKS.find((i) => i.id === inkId).name;
  const lines = ['T-shirt request for ' + BRAND, 'Colour: ' + sc.name, 'Size: ' + size + ', quantity ' + qty];
  if (mode === 'ours') {
    lines.push('Design: ' + (d ? d.name + ' (' + d.kind.toLowerCase() + ', our design)' : 'words only'));
    if (text.trim()) lines.push('Words: "' + text.trim() + '" (' + TEXT_STYLES[textStyle].label.toLowerCase() + ' lettering)');
    lines.push('Ink: ' + inkName);
  } else {
    lines.push(up.file ? 'Own artwork: ' + up.file.name + ' (I will attach the original file)' : 'Own artwork: I will attach my file');
  }
  const summary = lines.join('\n');
  const mailto = 'mailto:' + EMAIL + '?subject=' + encodeURIComponent('T-shirt request') + '&body=' + encodeURIComponent(summary + '\n\nName:\nPhone:');

  async function copy() {
    try { await navigator.clipboard.writeText(summary); setNote('Copied'); }
    catch (e) { if (taRef.current) taRef.current.select(); setNote('Select the text and copy it'); }
    setTimeout(() => setNote(''), 2200);
  }

  const tiles = DESIGNS.filter((x) => x.group === tab);
  return html`<section id="studio" className="page snap">
    <div className="wrap">
      <div className="section-head reveal">
        <p className="eyebrow">The studio</p>
        <h2>Build your tee</h2>
        <p>Everything updates on the shirt as you go. When you are happy with it, send us the details.</p>
      </div>
      <div className="studio-grid">
        <div className="stage">
          <div className="stage-card">
            <${Shirt} uid="main" hd=${true} color=${c.hex} label=${'Your T-shirt in ' + c.name}>
              <${Print} cfg=${cfg} shirtHex=${c.hex} />
            <//>
            <div className="stage-cap"><span>Front print</span><span>${c.name} / ${size}</span></div>
          </div>
        </div>

        <div className="controls">
          <div className="step first">
            <div className="step-title"><span className="step-n">01</span><h3>Shirt colour</h3><span className="step-val">${c.name}</span></div>
            <div className="swatches" role="radiogroup" aria-label="Shirt colour">
              ${COLORS.map((x, i) => html`<button key=${x.id} type="button" role="radio" aria-checked=${color === i} aria-label=${x.name} title=${x.name} className="swatch" style=${{ background: x.hex }}
                onMouseEnter=${() => setHov(i)} onMouseLeave=${() => setHov(null)} onFocus=${() => setHov(i)} onBlur=${() => setHov(null)} onClick=${() => setColor(i)} />`)}
            </div>
          </div>

          <div className="step">
            <div className="step-title"><span className="step-n">02</span><h3>Design</h3><span className="step-val">${mode === 'ours' ? (d ? d.name : 'Words only') : 'Your artwork'}</span></div>
            <div className="seg wide" role="group" aria-label="Design source">
              <button type="button" aria-pressed=${mode === 'ours'} onClick=${() => setMode('ours')}>Our designs</button>
              <button type="button" aria-pressed=${mode === 'upload'} onClick=${() => setMode('upload')}>Send yours</button>
            </div>
            ${mode === 'ours' && html`<div style=${{ display: 'grid', gap: '14px' }}>
              <div className="seg wide" role="group" aria-label="Design collection">
                <button type="button" aria-pressed=${tab === 'kurdish'} onClick=${() => setTab('kurdish')}>Kurdish</button>
                <button type="button" aria-pressed=${tab === 'classic'} onClick=${() => setTab('classic')}>Classic</button>
                <button type="button" aria-pressed=${tab === 'words'} onClick=${() => { setTab('words'); setDesign('none'); }}>Words only</button>
              </div>
              ${tab !== 'words' && html`<div className="tiles">
                ${tiles.map((x) => html`<button key=${x.id} type="button" className="tile" aria-pressed=${design === x.id} onClick=${() => setDesign(x.id)}>
                  <svg viewBox="0 0 100 100" aria-hidden="true">${x.draw('currentColor')}</svg>
                  <span>${x.name}</span><small>${x.kind}</small>
                </button>`)}
              </div>`}
              ${tab === 'words' && html`<p className="hint">No artwork, just your words. Write them in step 3, in English, Kurdish or any language you like.</p>`}
            </div>`}
            ${mode === 'upload' && html`<div style=${{ display: 'grid', gap: '14px' }}>
              <label className="drop" htmlFor="artfile" onDragOver=${(e) => e.preventDefault()} onDrop=${(e) => { e.preventDefault(); onFile(e.dataTransfer.files && e.dataTransfer.files[0]); }}>
                <input id="artfile" className="sr" type="file" accept="image/*" onChange=${(e) => onFile(e.target.files[0])} />
                <strong>${up.file ? up.file.name : 'Drop your artwork here'}</strong>
                <span>${up.file ? 'Tap to choose a different file' : 'PNG, JPG, SVG or WebP, up to 8 MB. Tap to browse.'}</span>
              </label>
              ${err && html`<p className="err" role="alert">${err}</p>`}
              ${up.file && html`<div className="sliders">
                <div className="slider"><label htmlFor="up-scale">Size</label><input id="up-scale" type="range" min="30" max="130" value=${up.scale} onChange=${(e) => setUp({ ...up, scale: +e.target.value })} /></div>
                <div className="slider"><label htmlFor="up-x">Left / right</label><input id="up-x" type="range" min="-60" max="60" value=${up.offX} onChange=${(e) => setUp({ ...up, offX: +e.target.value })} /></div>
                <div className="slider"><label htmlFor="up-y">Up / down</label><input id="up-y" type="range" min="-60" max="60" value=${up.offY} onChange=${(e) => setUp({ ...up, offY: +e.target.value })} /></div>
                <label className="check" htmlFor="up-blend"><input id="up-blend" type="checkbox" checked=${up.blend} onChange=${(e) => setUp({ ...up, blend: e.target.checked })} />Hide a white background</label>
              </div>`}
              <p className="note">This is an instant preview to give you an idea. Email us your original file and we will make a proper prototype and send it back so you can see how it will look.</p>
            </div>`}
          </div>

          <div className="step">
            <div className="step-title"><span className="step-n">03</span><h3>${mode === 'ours' ? 'Words, ink and size' : 'Size'}</h3></div>
            ${mode === 'ours' && html`<div style=${{ display: 'grid', gap: '20px' }}>
              <div className="field">
                <label className="lab" htmlFor="words">Your words (optional)</label>
                <input id="words" type="text" maxLength="48" placeholder="A name, a date, a sentence" value=${text} onChange=${(e) => onText(e.target.value)} />
                <div className="presets" aria-label="Quick words">
                  ${PRESETS.map((t) => html`<button key=${t} type="button" className=${'pchip' + (isArabic(t) ? ' ku' : '')} onClick=${() => pickPreset(t)}>${t}</button>`)}
                </div>
              </div>
              <div className="field"><span className="lab">Lettering</span>
                <div className="seg" role="group" aria-label="Lettering style">
                  ${Object.keys(TEXT_STYLES).map((k) => html`<button key=${k} type="button" aria-pressed=${textStyle === k} onClick=${() => setTextStyle(k)}>${TEXT_STYLES[k].label}</button>`)}
                </div>
              </div>
              <div className="field"><span className="lab">Print ink / ${inkId === 'auto' ? 'Auto' : INKS.find((i) => i.id === inkId).name}</span>
                <div className="inks" role="radiogroup" aria-label="Print ink">
                  ${INKS.map((k) => html`<button key=${k.id} type="button" role="radio" aria-checked=${inkId === k.id} aria-label=${k.name} title=${k.name} className="ink" style=${{ background: k.hex || 'conic-gradient(#15161A 0 50%, #F6F6F2 0 100%)' }} onClick=${() => setInkId(k.id)} />`)}
                </div>
              </div>
            </div>`}
            <div className="row">
              <div className="field"><span className="lab">Size</span>
                <div className="seg" role="group" aria-label="Shirt size">
                  ${SIZES.map((s) => html`<button key=${s} type="button" aria-pressed=${size === s} onClick=${() => setSize(s)}>${s}</button>`)}
                </div>
              </div>
              <div className="field"><span className="lab">Quantity</span>
                <div className="qty">
                  <button type="button" aria-label="Fewer" onClick=${() => setQty(Math.max(1, qty - 1))}>−</button>
                  <output aria-live="polite">${qty}</output>
                  <button type="button" aria-label="More" onClick=${() => setQty(Math.min(99, qty + 1))}>+</button>
                </div>
              </div>
            </div>
          </div>

          <div className="step">
            <div className="step-title"><span className="step-n">04</span><h3>Send us your request</h3></div>
            <p className="note">Copy this and call or email us to register. ${mode === 'upload' ? 'Attach your original artwork file to the email.' : ''}</p>
            <textarea ref=${taRef} id="summary" className="summary" readOnly rows="7" aria-label="Your request" value=${summary}></textarea>
            <div className="actions">
              <button type="button" className="btn primary" onClick=${copy}>${note || 'Copy request'}</button>
              <a className="btn" href=${mailto}>Email us</a>
              <a className="btn" href=${'tel:' + PHONE_TEL}>Call us</a>
            </div>
            <p className="note">Phone and email links may not open everywhere, so our details are also written out at the bottom of the page.</p>
          </div>
        </div>
      </div>
    </div>
  </section>`;
}

/* ---- the wall: a swipeable strip ---- */
function Wall({ onTry }) {
  const rail = useRef(null);
  const picks = [1, 8, 2, 9, 5, 6, 3, 7, 0, 4];
  const move = (dir) => {
    const r = rail.current;
    if (r) r.scrollBy({ left: dir * r.clientWidth * 0.8, behavior: REDUCED ? 'auto' : 'smooth' });
  };
  return html`<section id="wall" className="page wall-page snap">
    <div className="wrap wall-head">
      <div>
        <p className="eyebrow">Our designs</p>
        <h2>The wall</h2>
      </div>
      <p className="sub">Kurdish heritage first, then our classic prints. Swipe or use the arrows, then tap one to try it on.</p>
      <div className="arrows">
        <button type="button" aria-label="Previous designs" onClick=${() => move(-1)}>←</button>
        <button type="button" aria-label="Next designs" onClick=${() => move(1)}>→</button>
      </div>
    </div>
    <div className="rail" ref=${rail} tabIndex="0" role="region" aria-label="Our designs, scroll sideways">
      ${DESIGNS.map((d, k) => {
        const ci = picks[k % picks.length];
        const hex = COLORS[ci].hex;
        return html`<button key=${d.id} type="button" className="wcard" onClick=${() => onTry(d.id, ci)} aria-label=${'Try ' + d.name + ' on a ' + COLORS[ci].name + ' shirt'}>
          <${Shirt} uid=${'w' + d.id} color=${hex} label=${d.name + ' on a ' + COLORS[ci].name + ' shirt'}>
            <${Print} cfg=${{ mode: 'ours', design: d.id, text: '', inkId: 'auto' }} shirtHex=${hex} />
          <//>
          <b><span>${d.name}</span>${d.ku && html`<span className="ku" lang="ckb" dir="rtl">${d.ku}</span>`}</b>
          <small><span>${d.group === 'kurdish' ? 'Kurdish' : 'Classic'} / ${d.kind}</span><span>Try on</span></small>
        </button>`;
      })}
    </div>
  </section>`;
}

function How() {
  const items = [
    ['Choose a colour', 'Pick the shirt colour you like. The preview changes as you go.'],
    ['Choose a design', 'Use one of ours, add your own words, or upload your artwork to see it on the shirt.'],
    ['Call or email us', 'We are an online shop, so register your request by phone or email.'],
    ['We send a prototype', 'For your own artwork we make a quick prototype, so you can see how it will look before we go ahead.'],
  ];
  return html`<section id="how" className="page snap">
    <div className="wrap">
      <div className="section-head reveal"><p className="eyebrow">The process</p><h2>How it works</h2></div>
      <ol className="steps">
        ${items.map(([t, p], i) => html`<li key=${t} className="reveal"><span className="n">${String(i + 1).padStart(2, '0')}</span><h3>${t}</h3><p>${p}</p></li>`)}
      </ol>
    </div>
  </section>`;
}

function Contact() {
  const [note, setNote] = useState({});
  async function copy(key, value) {
    let msg = 'Copied';
    try { await navigator.clipboard.writeText(value); } catch (e) { msg = 'Select it and copy'; }
    setNote({ [key]: msg });
    setTimeout(() => setNote({}), 2200);
  }
  return html`<section id="contact" className="page band snap">
    <div className="wrap">
      <div className="section-head reveal">
        <p className="eyebrow">Contact</p>
        <h2>Register by phone or email</h2>
        <p>${BRAND} is an online shop, so there is no storefront to visit. Tell us the colour, the design and your size, and we will take it from there.</p>
      </div>
      <div className="contact-grid">
        <div className="contact-card reveal">
          <span className="lab">Call us</span>
          <span className="big">${PHONE}</span>
          <div className="actions">
            <a className="btn primary small" href=${'tel:' + PHONE_TEL}>Call</a>
            <button type="button" className="btn small" onClick=${() => copy('p', PHONE)}>${note.p || 'Copy number'}</button>
          </div>
        </div>
        <div className="contact-card reveal">
          <span className="lab">Write to us</span>
          <span className="big">${EMAIL}</span>
          <div className="actions">
            <a className="btn primary small" href=${'mailto:' + EMAIL}>Email</a>
            <button type="button" className="btn small" onClick=${() => copy('e', EMAIL)}>${note.e || 'Copy address'}</button>
          </div>
        </div>
      </div>
      <div className="foot"><span>© 2026 ${BRAND}. Online shop.</span><span>${PHONE} / ${EMAIL}</span></div>
    </div>
  </section>`;
}

const PAGES = [['hero', 'Home'], ['studio', 'Studio'], ['wall', 'Designs'], ['how', 'Process'], ['contact', 'Contact']];
function DotNav({ active }) {
  return html`<nav className="dotnav" aria-label="Pages">
    ${PAGES.map(([id, label]) => html`<button key=${id} type="button" aria-label=${label} aria-current=${active === id} onClick=${() => go(id)}><span>${label}</span></button>`)}
  </nav>`;
}

const PAL_BG = { both: 'linear-gradient(135deg, #3F4FE6 50%, #F2509A 50%)', boys: '#1F63F0', girls: '#E22E7B' };
function App() {
  const [color, setColor] = useState(1);
  const [mode, setMode] = useState('ours');
  const [design, setDesign] = useState('sun21');
  const [text, setText] = useState('');
  const [textStyle, setTextStyle] = useState('bold');
  const [inkId, setInkId] = useState('auto');
  const [size, setSize] = useState('M');
  const [qty, setQty] = useState(1);
  const [up, setUp] = useState({ file: null, scale: 90, offX: 0, offY: 0, blend: false });
  const [active, setActive] = useState('hero');
  const [palette, setPalette] = useState(() => {
    try { const v = localStorage.getItem('inkroom-palette'); if (v === 'both' || v === 'boys' || v === 'girls') return v; } catch (e) {}
    return 'both';
  });
  const st = { color, setColor, mode, setMode, design, setDesign, text, setText, textStyle, setTextStyle, inkId, setInkId, size, setSize, qty, setQty, up, setUp };

  useEffect(() => {
    document.documentElement.setAttribute('data-palette', palette);
    try { localStorage.setItem('inkroom-palette', palette); } catch (e) {}
  }, [palette]);

  useEffect(() => {
    let raf = 0;
    const calc = () => {
      raf = 0;
      let cur = 'hero';
      for (const [id] of PAGES) {
        const el = document.getElementById(id);
        if (el && el.getBoundingClientRect().top <= window.innerHeight * 0.45) cur = id;
      }
      setActive(cur);
    };
    const on = () => { if (!raf) raf = requestAnimationFrame(calc); };
    calc();
    window.addEventListener('scroll', on, { passive: true });
    return () => window.removeEventListener('scroll', on);
  }, []);

  function tryOn(id, ci) { setMode('ours'); setDesign(id); setColor(ci); go('studio'); }

  return html`<div>
    <header className="bar">
      <div className="wrap bar-in">
        <button type="button" className="brand" onClick=${() => go('hero')} aria-label=${BRAND + ', back to top'}>
          <${Mark} />
          ${BRAND}
        </button>
        <nav className="nav" aria-label="Main">
          <div className="palette" role="radiogroup" aria-label="Colour theme">
            <span className="lab">Theme</span>
            ${PALETTES.map(([k, l]) => html`<button key=${k} type="button" role="radio" aria-checked=${palette === k} aria-label=${l} title=${l} className="pal" style=${{ background: PAL_BG[k] }} onClick=${() => setPalette(k)} />`)}
          </div>
          <button type="button" className="link" onClick=${() => go('studio')}>Studio</button>
          <button type="button" className="link" onClick=${() => go('wall')}>Designs</button>
          <button type="button" className="link" onClick=${() => go('how')}>Process</button>
          <button type="button" className="btn primary small" onClick=${() => go('contact')}>Contact</button>
        </nav>
      </div>
    </header>
    <${DotNav} active=${active} />
    <main>
      <${Hero} />
      <${Studio} st=${st} />
      <${Wall} onTry=${tryOn} />
      <${How} />
      <${Contact} />
    </main>
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>

</body></html>
